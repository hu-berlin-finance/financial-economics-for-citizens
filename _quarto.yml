project:
  type: website
  output-dir: docs
  resources:
    # The rating app is a self-contained HTML page, copied as is and framed by app/index.qmd
    - app/rating-app.html
    # GitHub Pages serves docs/ as is, without Jekyll
    - .nojekyll

website:
  title: "Financial Economics for Citizens"
  search:
    location: navbar
  navbar:
    left:
      - href: app/index.qmd
        text: Rating App
      - href: wiki/index.qmd
        text: Wiki

format:
  html:
    theme:
      light: [cosmo, styles/light.scss]
      dark: [darkly, styles/dark.scss]
    css: styles/wiki.css
    include-after-body: styles/source-dialog.html
    toc: true
    toc-depth: 3
    anchor-sections: true
